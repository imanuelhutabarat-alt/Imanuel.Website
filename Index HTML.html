<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MUSIC APPLE</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#080808;
    color:white;
    overflow-x:hidden;
}

/* =========================
   SIDEBAR
========================= */

.sidebar{
    position:fixed;
    left:0;
    top:0;
    bottom:0;
    width:240px;
    background:#111;
    border-right:1px solid #292929;
    padding:25px 15px;
    z-index:20;
}

.logo{
    font-size:23px;
    font-weight:bold;
    margin-bottom:35px;
    padding-left:10px;
}

.logo span{
    color:#ff375f;
}

.menu-title{
    color:#666;
    font-size:11px;
    margin:25px 10px 8px;
    text-transform:uppercase;
}

.menu button{
    width:100%;
    border:0;
    background:transparent;
    color:#999;
    text-align:left;
    padding:13px;
    margin:3px 0;
    border-radius:10px;
    cursor:pointer;
    font-size:15px;
}

.menu button:hover,
.menu button.active{
    background:#222;
    color:white;
}

/* =========================
   MAIN
========================= */

.main{
    margin-left:240px;
    padding:25px;
    padding-bottom:130px;
}

/* TOP */

.topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
    margin-bottom:25px;
}

.search{
    width:400px;
    max-width:100%;
    background:#1c1c1e;
    color:white;
    border:1px solid #333;
    outline:none;
    border-radius:12px;
    padding:13px 16px;
    font-size:14px;
}

.search:focus{
    border-color:#ff375f;
}

.account{
    background:#1c1c1e;
    padding:10px 16px;
    border-radius:20px;
    color:#ddd;
}

/* =========================
   HERO
========================= */

.hero{
    min-height:300px;
    border-radius:25px;
    padding:45px;
    display:flex;
    align-items:center;
    margin-bottom:35px;

    background:
    radial-gradient(
        circle at 80% 20%,
        #ff375f66,
        transparent 35%
    ),
    radial-gradient(
        circle at 60% 100%,
        #8e2de255,
        transparent 35%
    ),
    linear-gradient(
        120deg,
        #1c1c1e,
        #101010
    );
}

.hero small{
    color:#aaa;
    letter-spacing:2px;
}

.hero h1{
    font-size:52px;
    margin:10px 0;
}

.hero p{
    color:#aaa;
    max-width:550px;
    line-height:1.6;
}

.hero button{
    margin-top:22px;
    border:0;
    background:#ff375f;
    color:white;
    padding:13px 24px;
    border-radius:25px;
    font-weight:bold;
    cursor:pointer;
}

.hero button:hover{
    transform:scale(1.04);
}

/* =========================
   SECTION
========================= */

.section{
    margin-bottom:40px;
}

.section-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:18px;
}

.section-header h2{
    font-size:23px;
}

.see{
    color:#ff375f;
    cursor:pointer;
}

/* =========================
   CATEGORY
========================= */

.categories{
    display:flex;
    gap:10px;
    overflow-x:auto;
    margin-bottom:22px;
}

.categories button{
    white-space:nowrap;
    border:1px solid #333;
    background:#151515;
    color:#aaa;
    border-radius:20px;
    padding:9px 17px;
    cursor:pointer;
}

.categories button:hover,
.categories button.active{
    background:#ff375f;
    color:white;
    border-color:#ff375f;
}

/* =========================
   SONG GRID
========================= */

.song-grid{
    display:grid;
    grid-template-columns:
    repeat(auto-fill,minmax(180px,1fr));

    gap:18px;
}

.song{
    background:#141414;
    border-radius:15px;
    padding:12px;
    position:relative;
    cursor:pointer;
    transition:.2s;
}

.song:hover{
    background:#202020;
    transform:translateY(-4px);
}

.cover{
    width:100%;
    aspect-ratio:1;
    border-radius:11px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:48px;
    margin-bottom:12px;

    background:
    linear-gradient(
        135deg,
        #ff375f,
        #8e2de2
    );
}

.song:nth-child(2) .cover{
    background:
    linear-gradient(
        135deg,
        #2196f3,
        #673ab7
    );
}

.song:nth-child(3) .cover{
    background:
    linear-gradient(
        135deg,
        #00c853,
        #00695c
    );
}

.song:nth-child(4) .cover{
    background:
    linear-gradient(
        135deg,
        #ff9800,
        #e91e63
    );
}

.song:nth-child(5) .cover{
    background:
    linear-gradient(
        135deg,
        #00bcd4,
        #3f51b5
    );
}

.song h3{
    font-size:15px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.song p{
    color:#777;
    font-size:13px;
    margin-top:5px;
}

.favorite{
    position:absolute;
    right:18px;
    top:18px;

    width:34px;
    height:34px;

    border:0;
    border-radius:50%;

    background:#000b;
    color:white;

    cursor:pointer;
    font-size:17px;
}

.favorite.active{
    color:#ff375f;
}

/* =========================
   EMPTY
========================= */

.empty{
    color:#777;
    padding:30px 0;
}

/* =========================
   PLAYER
========================= */

.player{
    position:fixed;
    left:0;
    right:0;
    bottom:0;

    height:92px;

    background:#151515ee;
    backdrop-filter:blur(18px);

    border-top:1px solid #333;

    display:flex;
    align-items:center;

    padding:12px 25px;

    z-index:50;
}

.now{
    width:25%;
    display:flex;
    align-items:center;
    gap:12px;
    min-width:0;
}

.now-cover{
    width:55px;
    height:55px;
    flex-shrink:0;

    border-radius:8px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
    linear-gradient(
        135deg,
        #ff375f,
        #8e2de2
    );
}

.now-info{
    min-width:0;
}

.now-info h4{
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.now-info p{
    color:#777;
    font-size:12px;
    margin-top:3px;
}

.controls{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
}

.control-buttons{
    display:flex;
    align-items:center;
    gap:20px;
}

.control-buttons button{
    background:none;
    border:0;
    color:white;
    cursor:pointer;
    font-size:17px;
}

.control-buttons button:hover{
    color:#ff375f;
}

.control-buttons .main-play{
    width:40px;
    height:40px;

    border-radius:50%;

    background:white;
    color:black;

    font-size:18px;
}

.progress-area{
    display:flex;
    align-items:center;
    width:80%;
    gap:8px;
    margin-top:6px;
}

.time{
    font-size:10px;
    color:#777;
    min-width:32px;
}

.progress{
    flex:1;
    accent-color:#ff375f;
    cursor:pointer;
}

.right{
    width:20%;
    display:flex;
    align-items:center;
    justify-content:flex-end;
    gap:10px;
}

.volume{
    width:100px;
    accent-color:#ff375f;
}

/* =========================
   MOBILE
========================= */

@media(max-width:800px){

    .sidebar{
        top:auto;
        bottom:92px;
        height:65px;
        width:100%;

        padding:5px;

        border-right:0;
        border-top:1px solid #292929;
    }

    .logo,
    .menu-title{
        display:none;
    }

    .menu{
        display:flex;
        justify-content:space-around;
    }

    .menu button{
        width:auto;
        padding:9px;
        text-align:center;
        font-size:12px;
    }

    .main{
        margin-left:0;
        padding:17px;
        padding-bottom:175px;
    }

    .topbar{
        margin-bottom:18px;
    }

    .account{
        display:none;
    }

    .search{
        width:100%;
    }

    .hero{
        min-height:240px;
        padding:28px;
    }

    .hero h1{
        font-size:36px;
    }

    .song-grid{
        grid-template-columns:
        repeat(2,1fr);
        gap:12px;
    }

    .player{
        height:92px;
        padding:9px;
    }

    .now{
        width:35%;
    }

    .now-cover{
        width:44px;
        height:44px;
    }

    .right{
        width:auto;
    }

    .volume{
        display:none;
    }

    .control-buttons{
        gap:9px;
    }

    .progress-area{
        width:95%;
    }

}

/* =========================
   EXTRA SMALL
========================= */

@media(max-width:450px){

    .now-info h4{
        font-size:12px;
    }

    .now-info p{
        font-size:10px;
    }

    .control-buttons button{
        font-size:14px;
    }

    .control-buttons .main-play{
        width:35px;
        height:35px;
    }

}

</style>
</head>


<body>


<!-- =========================
     SIDEBAR
========================= -->

<aside class="sidebar">

    <div class="logo">
        🎵 MUSIC <span>APPLE</span>
    </div>

    <div class="menu">

        <button
            class="active"
            onclick="showPage('home')">
            🏠 Home
        </button>

        <button
            onclick="showPage('search')">
            🔎 Search
        </button>

        <button
            onclick="showPage('library')">
            ❤️ Library
        </button>

        <button
            onclick="showPage('playlist')">
            📋 Playlist
        </button>

    </div>


    <div class="menu-title">
        MUSIC
    </div>

    <div class="menu">

        <button
            onclick="filterCategory('Rohani')">
            ✝️ Rohani
        </button>

        <button
            onclick="filterCategory('Indonesia')">
            🇮🇩 Indonesia
        </button>

        <button
            onclick="filterCategory('Viral')">
            🔥 Viral
        </button>

    </div>

</aside>



<!-- =========================
     MAIN
========================= -->

<main class="main">


    <!-- TOPBAR -->

    <div class="topbar">

        <input
            id="searchInput"
            class="search"
            placeholder="🔎 Cari lagu atau artis..."
            oninput="searchMusic()"
        >

        <div class="account">
            👤 MUSIC APPLE
        </div>

    </div>



    <!-- HOME -->

    <div id="homePage">


        <section class="hero">

            <div>

                <small>
                    WELCOME TO
                </small>

                <h1>
                    MUSIC APPLE
                </h1>

                <p>
                    Dengarkan musik favoritmu,
                    temukan lagu baru, dan buat
                    koleksi musikmu sendiri.
                </p>

                <button
                    onclick="playSong(0)">
                    ▶ Mulai Mendengarkan
                </button>

            </div>

        </section>



        <section class="section">

            <div class="section-header">

                <h2>
                    🎧 Pilihan Untukmu
                </h2>

                <span
                    class="see"
                    onclick="showPage('search')">
                    Lihat Semua
                </span>

            </div>


            <div class="categories">

                <button
                    class="active"
                    onclick="filterCategory('Semua',this)">
                    Semua
                </button>

                <button
                    onclick="filterCategory('Rohani',this)">
                    ✝️ Rohani
                </button>

                <button
                    onclick="filterCategory('Indonesia',this)">
                    🇮🇩 Indonesia
                </button>

                <button
                    onclick="filterCategory('Viral',this)">
                    🔥 Viral
                </button>

            </div>


            <div
                id="songGrid"
                class="song-grid">
            </div>

        </section>

    </div>



    <!-- SEARCH -->

    <div
        id="searchPage"
        style="display:none">

        <section class="section">

            <div class="section-header">

                <h2>
                    🔎 Hasil Pencarian
                </h2>

            </div>

            <div
                id="searchGrid"
                class="song-grid">
            </div>

        </section>

    </div>



    <!-- LIBRARY -->

    <div
        id="libraryPage"
        style="display:none">

        <section class="section">

            <div class="section-header">

                <h2>
                    ❤️ Lagu Favorit
                </h2>

            </div>

            <div
                id="libraryGrid"
                class="song-grid">
            </div>

        </section>

    </div>



    <!-- PLAYLIST -->

    <div
        id="playlistPage"
        style="display:none">

        <section class="section">

            <div class="section-header">

                <h2>
                    📋 Playlist Saya
                </h2>

            </div>

            <div
                id="playlistGrid"
                class="song-grid">
            </div>

        </section>

    </div>


</main>



<!-- =========================
     PLAYER
========================= -->

<div class="player">


    <div class="now">

        <div
            id="nowCover"
            class="now-cover">
            🎵
        </div>

        <div class="now-info">

            <h4 id="nowTitle">
                Belum ada lagu
            </h4>

            <p id="nowArtist">
                MUSIC APPLE
            </p>

        </div>

    </div>



    <div class="controls">

        <div class="control-buttons">

            <button
                onclick="toggleShuffle()">
                🔀
            </button>

            <button
                onclick="previousSong()">
                ⏮
            </button>

            <button
                id="playButton"
                class="main-play"
                onclick="togglePlay()">
                ▶
            </button>

            <button
                onclick="nextSong()">
                ⏭
            </button>

            <button
                onclick="toggleRepeat()">
                🔁
            </button>

        </div>


        <div class="progress-area">

            <span
                id="currentTime"
                class="time">
                0:00
            </span>

            <input
                id="progress"
                class="progress"
                type="range"
                min="0"
                max="100"
                value="0"
                oninput="seekSong()"
            >

            <span
                id="duration"
                class="time">
                0:00
            </span>

        </div>

    </div>



    <div class="right">

        🔊

        <input
            id="volume"
            class="volume"
            type="range"
            min="0"
            max="1"
            step="0.01"
            value="1"
            oninput="changeVolume()"
        >

    </div>

</div>



<audio id="audio"></audio>



<script>

/* =====================================================
   MUSIC DATABASE
===================================================== */

const songs = [

    {
        title:"Bapa Engkau Sungguh Baik",
        artist:"MUSIC APPLE",
        category:"Rohani",
        file:"music/bapa-engkau-sungguh-baik.mp3"
    },

    {
        title:"Teruskanlah Firman",
        artist:"MUSIC APPLE",
        category:"Rohani",
        file:"music/teruskanlah-firman.mp3"
    },

    {
        title:"Terpujilah Tuhan Yesus",
        artist:"MUSIC APPLE",
        category:"Rohani",
        file:"music/terpujilah-tuhan-yesus.mp3"
    },

    {
        title:"Lagu Indonesia",
        artist:"MUSIC APPLE",
        category:"Indonesia",
        file:"music/indonesia.mp3"
    },

    {
        title:"Viral Music",
        artist:"MUSIC APPLE",
        category:"Viral",
        file:"music/viral.mp3"
    },

    {
        title:"My Favorite Song",
        artist:"MUSIC APPLE",
        category:"Indonesia",
        file:"music/favorite.mp3"
    }

];


/* =====================================================
   VARIABLES
===================================================== */

const audio =
document.getElementById("audio");

let currentIndex = 0;

let isShuffle = false;

let isRepeat = false;

let favorites =
JSON.parse(
    localStorage.getItem(
        "musicAppleFavorites"
    )
) || [];


/* =====================================================
   DISPLAY SONGS
===================================================== */

function displaySongs(list,specificGrid){

    const grid =
    document.getElementById(
        specificGrid
    );

    grid.innerHTML="";


    if(list.length===0){

        grid.innerHTML=
        `<div class="empty">
            Tidak ada lagu.
        </div>`;

        return;

    }


    list.forEach(song=>{

        const index =
        songs.indexOf(song);

        const isFav =
        favorites.includes(index);


        const card =
        document.createElement("div");

        card.className="song";


        card.innerHTML=`

            <div class="cover">
                🎵
            </div>

            <button
                class="favorite ${isFav?"active":""}"
                onclick="
                    event.stopPropagation();
                    toggleFavorite(${index})
                ">

                ${isFav?"♥":"♡"}

            </button>

            <h3>
                ${song.title}
            </h3>

            <p>
                ${song.artist}
            </p>

        `;


        card.onclick=()=>{
            playSong(index);
        };


        grid.appendChild(card);

    });

}


/* =====================================================
   HOME
===================================================== */

function displayHome(){

    displaySongs(
        songs,
        "songGrid"
    );

}


/* =====================================================
   PLAY SONG
===================================================== */

function playSong(index){

    currentIndex=index;

    const song=
    songs[index];


    audio.src=
    song.file;


    audio.play()
    .catch(()=>{

        alert(
            "File musik belum ditemukan. Pastikan file MP3 berada di folder music."
        );

    });


    document.getElementById(
        "nowTitle"
    ).textContent=
    song.title;


    document.getElementById(
        "nowArtist"
    ).textContent=
    song.artist;


    document.getElementById(
        "playButton"
    ).textContent="⏸";

}


/* =====================================================
   PLAY / PAUSE
===================================================== */

function togglePlay(){

    if(!audio.src){

        playSong(0);

        return;

    }


    if(audio.paused){

        audio.play();

        document.getElementById(
            "playButton"
        ).textContent="⏸";

    }else{

        audio.pause();

        document.getElementById(
            "playButton"
        ).textContent="▶";

    }

}


/* =====================================================
   NEXT
===================================================== */

function nextSong(){

    if(isShuffle){

        currentIndex=
        Math.floor(
            Math.random()*songs.length
        );

    }else{

        currentIndex++;

        if(
            currentIndex>=songs.length
        ){

            currentIndex=0;

        }

    }

    playSong(currentIndex);

}


/* =====================================================
   PREVIOUS
===================================================== */

function previousSong(){

    currentIndex--;

    if(currentIndex<0){

        currentIndex=
        songs.length-1;

    }

    playSong(currentIndex);

}


/* =====================================================
   AUTO NEXT
===================================================== */

audio.addEventListener(
    "ended",
    ()=>{

        if(isRepeat){

            playSong(currentIndex);

        }else{

            nextSong();

        }

    }
);


/* =====================================================
   PROGRESS
===================================================== */

audio.addEventListener(
    "timeupdate",
    ()=>{

        if(!audio.duration)
            return;


        document.getElementById(
            "progress"
        ).value=
        (
            audio.currentTime/
            audio.duration
        )*100;


        document.getElementById(
            "currentTime"
        ).textContent=
        formatTime(
            audio.currentTime
        );


    }
);


audio.addEventListener(
    "loadedmetadata",
    ()=>{

        document.getElementById(
            "duration"
        ).textContent=
        formatTime(
            audio.duration
        );

    }
);


function seekSong(){

    if(!audio.duration)
        return;


    audio.currentTime=
    (
        document.getElementById(
            "progress"
        ).value/100
    )*
    audio.duration;

}


function formatTime(seconds){

    if(!seconds ||
       isNaN(seconds))
        return "0:00";


    const minutes=
    Math.floor(seconds/60);


    const secs=
    Math.floor(seconds%60);


    return minutes+
    ":"+
    String(secs)
    .padStart(2,"0");

}


/* =====================================================
   VOLUME
===================================================== */

function changeVolume(){

    audio.volume=
    document.getElementById(
        "volume"
    ).value;

}


/* =====================================================
   FAVORITE
===================================================== */

function toggleFavorite(index){

    if(
        favorites.includes(index)
    ){

        favorites=
        favorites.filter(
            i=>i!==index
        );

    }else{

        favorites.push(index);

    }


    localStorage.setItem(
        "musicAppleFavorites",
        JSON.stringify(
            favorites
        )
    );


    displayHome();


    if(
        document.getElementById(
            "libraryPage"
        ).style.display!=="none"
    ){

        displayFavorites();

    }

}


/* =====================================================
   FAVORITES DISPLAY
===================================================== */

function displayFavorites(){

    const favoriteSongs=
    favorites.map(
        index=>songs[index]
    );


    displaySongs(
        favoriteSongs,
        "libraryGrid"
    );

}


/* =====================================================
   PLAYLIST
===================================================== */

function displayPlaylist(){

    displaySongs(
        songs,
        "playlistGrid"
    );

}


/* =====================================================
   SEARCH
===================================================== */

function searchMusic(){

    const value=
    document.getElementById(
        "searchInput"
    ).value
    .toLowerCase();


    const result=
    songs.filter(song=>

        song.title
        .toLowerCase()
        .includes(value)

        ||

        song.artist
        .toLowerCase()
        .includes(value)

    );


    showPage("search");


    displaySongs(
        result,
        "searchGrid"
    );

}


/* =====================================================
   CATEGORY
===================================================== */

function filterCategory(
    category,
    button=null
){

    let result;


    if(category==="Semua"){

        result=songs;

    }else{

        result=
        songs.filter(
            song=>
            song.category===category
        );

    }


    showPage("home");


    displaySongs(
        result,
        "songGrid"
    );


    if(button){

        document
        .querySelectorAll(
            ".categories button"
        )
        .forEach(
            btn=>
            btn.classList.remove(
                "active"
            )
        );


        button.classList.add(
            "active"
        );

    }

}


/* =====================================================
   PAGE NAVIGATION
===================================================== */

function showPage(page){

    document.getElementById(
        "homePage"
    ).style.display="none";


    document.getElementById(
        "searchPage"
    ).style.display="none";


    document.getElementById(
        "libraryPage"
    ).style.display="none";


    document.getElementById(
        "playlistPage"
    ).style.display="none";


    if(page==="home"){

        document.getElementById(
            "homePage"
        ).style.display="block";

        displayHome();

    }


    if(page==="search"){

        document.getElementById(
            "searchPage"
        ).style.display="block";

    }


    if(page==="library"){

        document.getElementById(
            "libraryPage"
        ).style.display="block";

        displayFavorites();

    }


    if(page==="playlist"){

        document.getElementById(
            "playlistPage"
        ).style.display="block";

        displayPlaylist();

    }

}


/* =====================================================
   SHUFFLE
===================================================== */

function toggleShuffle(){

    isShuffle=!isShuffle;

}


/* =====================================================
   REPEAT
===================================================== */

function toggleRepeat(){

    isRepeat=!isRepeat;

}


/* =====================================================
   START
===================================================== */

displayHome();

</script>
